<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- ===== ESTILOS PARA PESTAÑAS Y PANELES ===== -->
    <!-- NOTA: Estos estilos deberían moverse a tu archivo CSS principal (src/assets/css/...) -->
    <style>
        /* ===== NUEVOS ESTILOS PARA PESTAÑAS Y PANELES ===== */
        .tabs {
            display: flex;
            gap: 10px;
            margin: 15px 0 20px 0;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .tab {
            padding: 8px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #888;
        }
        .tab:hover {
            color: #333;
        }
        .tab.active {
            color: #0078d4;
            border-bottom-color: #0078d4;
        }
        .panel {
            display: block;
        }
        .panel.hidden {
            display: none;
        }
        .ms-login-info {
            text-align: center;
            margin: 15px 0;
            color: #555;
            font-size: 14px;
        }
        .ms-login-btn {
            width: 100%;
            padding: 12px;
            background: #0078d4;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ms-login-btn:hover {
            background: #005a9e;
        }
        #ms-profile-info {
            margin-top: 15px;
            text-align: center;
            color: #28a745;
            font-weight: bold;
            display: none; /* Se mostrará desde JS tras login exitoso */
        }
        /* ===== FIN ESTILOS NUEVOS ===== */
    </style>
</head>
<body>
<div class="login-content">
    <div class="login-card-main">
        <!-- Encabezado original -->
        <div class="login-header">
            <i class="fas fa-user-circle login-icon"></i>
            <p class="login-title" id="login-title"></p>
        </div>

        <!-- ===== PESTAÑAS ===== -->
        <div class="tabs">
            <button class="tab active" id="tabWeb" data-mode="web">Cuenta Web</button>
            <button class="tab" id="tabMicrosoft" data-mode="microsoft">Cuenta Microsoft</button>
        </div>

        <!-- ===== PANEL WEB (formulario original) ===== -->
        <div class="panel" id="panelWeb">
            <small class="info-login" id="info-login"></small>

            <div class="login-form">
                <div class="login-input-group">
                    <label id="username-label"></label>
                    <input type="text" class="Mail login-input" spellcheck="false" autocomplete="username">
                </div>

                <div class="login-input-group">
                    <label id="password-label"></label>
                    <input type="password" class="Password login-input" spellcheck="false" autocomplete="current-password">
                </div>

                <div class="login-links">
                    <a class="password-reset" id="password-reset-link" target="_blank"></a>
                    <a class="new-user" id="new-user-link" target="_blank"></a>
                </div>

                <!-- Botón de inicio de sesión web (existente) -->
                <button class="login-btn primary-btn" id="login-btn"></button>
                <button class="cancel cancel-login" id="cancel-login-btn" style="display: none;"></button>
            </div>
        </div>

        <!-- ===== PANEL MICROSOFT (NUEVO) ===== -->
        <div class="panel hidden" id="panelMicrosoft">
            <div class="ms-login-info">
                <i class="fas fa-microsoft" style="font-size: 24px; display: block; margin-bottom: 10px;"></i>
                Inicia sesión con tu cuenta de Microsoft para jugar con tu skin y UUID reales.
            </div>
            <button class="ms-login-btn" id="ms-login-btn">
                <i class="fab fa-microsoft"></i> Iniciar sesión con Microsoft
            </button>
            <!-- Perfil mostrado después del login (se llenará desde JS) -->
            <div id="ms-profile-info"></div>
        </div>

        <!-- ===== TARJETAS DE 2FA Y VERIFICACIÓN (NO TOCADAS) ===== -->
        <div class="a2f-card" style="display: none;">
            <div class="login-header">
                <i class="fas fa-shield-alt login-icon"></i>
                <p class="login-title" id="a2f-label"></p>
            </div>
            <div class="info-login-2f" id="info-login-2f"></div>
            <div class="login-input-group">
                <input type="text" class="a2f login-input" spellcheck="false" placeholder="000000">
            </div>
            <button class="login-btn-2f primary-btn" id="a2f-login-btn"></button>
            <button class="cancel cancel-2f" id="cancel-a2f-btn"></button>
        </div>

        <div class="email-verify-card" style="display: none;">
            <div class="login-header">
                <i class="fas fa-envelope login-icon"></i>
                <p class="login-title" id="email-verify-label"></p>
            </div>
            <div class="info-login-email" id="info-login-email"></div>
            <button class="cancel cancel-email" id="cancel-email-btn"></button>
        </div>
    </div>
</div>

<!-- ===== SCRIPT PARA PESTAÑAS (SOLO VISUAL) ===== -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const tabWeb = document.getElementById('tabWeb');
        const tabMicrosoft = document.getElementById('tabMicrosoft');
        const panelWeb = document.getElementById('panelWeb');
        const panelMicrosoft = document.getElementById('panelMicrosoft');

        function switchTab(mode) {
            tabWeb.classList.toggle('active', mode === 'web');
            tabMicrosoft.classList.toggle('active', mode === 'microsoft');
            panelWeb.classList.toggle('hidden', mode !== 'web');
            panelMicrosoft.classList.toggle('hidden', mode !== 'microsoft');
        }

        tabWeb.addEventListener('click', () => switchTab('web'));
        tabMicrosoft.addEventListener('click', () => switchTab('microsoft'));

        // Por defecto, panel web visible
        switchTab('web');
    });
</script>
</body>
</html>
